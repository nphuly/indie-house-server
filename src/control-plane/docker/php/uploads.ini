; Audio uploads are streamed through Livewire before they are moved to object storage.
; Keep this slightly above the 500 MiB application-level validation limit.
upload_max_filesize = 512M
post_max_size = 512M

; A create-album request can contain a large set of track draft fields.
max_file_uploads = 100
max_input_vars = 10000

; Uploads are streamed to a temporary file, so their size must not require
; equivalent PHP memory. The extra headroom covers metadata validation.
memory_limit = 256M
